# Bioconda-ready recipe for gapit.
# Field sources: version/license/python/deps mirror pyproject.toml exactly; the
# external binaries mirror pixi.toml's conda dependencies. sha256 below hashes
# the official PyPI sdist (verified against the release-workflow upload log).
# NOTE: the sha256 is still the 0.3.1 sdist hash — replace it with the 0.4.0
# sdist hash (dist/gapit-0.4.0.tar.gz) at bioconda submission time.
{% set name = "gapit" %}
{% set version = "0.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 9360de57bd233c8dfb6dcebb2d8d9f60626127de7052fa5bbc4672e877ad65ff

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.11
    - pip
    - hatchling
  run:
    - python >=3.11
    - typer >=0.12
    - pydantic >=2.7
    - rich >=13
    - blast >=2.15
    - minimap2 >=2.24

test:
  # The repo's pytest suite (776 offline tests) is NOT run here: the sdist does
  # not ship tests/ and bioconda-recipes carries only this recipe file. Full
  # suite coverage lives in the repo's own CI. These commands smoke-test the
  # installed console script end to end (no network: listing + schema only —
  # provider fetches download from upstream and are exercised in repo CI).
  imports:
    - gapit
    - gapit.providers
  commands:
    - gapit --version
    - gapit schema report > /dev/null
    # db list exits 4 (DATADIR_NOT_FOUND) when the datadir does not exist,
    # so create it first.
    - mkdir -p "${TMPDIR:-/tmp}/gapit-smoke-db"
    - gapit db list --datadir "${TMPDIR:-/tmp}/gapit-smoke-db" > /dev/null

about:
  home: https://github.com/indexofire/gapit
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Mass screening of contigs and reads for known genes
  description: >-
    Agent-first Python reimplementation of abricate: BLAST-based screening of
    assemblies with byte-compatible TSV output plus first-class JSON and
    Markdown, FASTQ read screening via minimap2, and on-demand database
    installs — every provider downloads from upstream at fetch time (nothing
    is bundled: CARD/VFDB terms forbid redistribution).
  dev_url: https://github.com/indexofire/gapit
  doc_url: https://indexofire.github.io/gapit/

extra:
  recipe-maintainers:
    - indexofire
