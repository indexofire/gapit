[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gapit"
version = "0.9.0"
description = "Compatibility package: gapit was renamed to gspec. Keeps the gapit import working and installs gspec."
readme = "README.md"
authors = [{ name = "indexofire", email = "indexofire@gmail.com" }]
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["gapit", "gspec", "transition", "rename", "bioinformatics"]
dependencies = [
  "gspec>=0.8.1,<0.10",
]

classifiers = [
  "Development Status :: 7 - Inactive",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/indexofire/gspec"
Documentation = "https://indexofire.github.io/gspec/"
Changelog = "https://github.com/indexofire/gspec/blob/main/CHANGELOG.md"
Source = "https://github.com/indexofire/gspec"
Issues = "https://github.com/indexofire/gspec/issues"

[project.scripts]
# The legacy command names live here, not in gspec: on an upgrade pip installs
# gspec first, then uninstalls the pre-0.8 `gapit` (which deletes bin/gapit),
# then installs this package -- so the scripts written last survive.
gapit = "gspec.cli:app"
gapit-mcp = "gspec.mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gapit"]
