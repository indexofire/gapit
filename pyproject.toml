[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gspec"
version = "0.8.0"
description = "Declarative typing databases for bacterial genomes: gene-panel and locus screening, serotype/AMR/virulence designation, machine-readable contracts"
readme = "README.md"
authors = [{ name = "indexofire", email = "indexofire@gmail.com" }]
requires-python = ">=3.12,<3.13"
license = "MIT"
keywords = ["bioinformatics", "bacterial-typing", "serotyping", "gene-screening", "blast",
            "minimap2", "genomics", "AMR", "virulence", "abricate"]
dependencies = [
  "click>=8.2",
  "pydantic>=2.7",
  "rich>=13",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/indexofire/gspec"
Documentation = "https://indexofire.github.io/gspec/"
Changelog = "https://github.com/indexofire/gspec/blob/main/CHANGELOG.md"
Source = "https://github.com/indexofire/gspec"
Issues = "https://github.com/indexofire/gspec/issues"

[project.scripts]
gspec = "gapit.cli:app"
gspec-mcp = "gapit.mcp:main"
# Pre-0.8 names, kept as aliases so existing pipelines keep working.
gapit = "gapit.cli:app"
gapit-mcp = "gapit.mcp:main"

[project.optional-dependencies]
gseek = ["gseek>=0.10.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/gapit"]
# Hatchling's `packages` selection ships every non-gitignored file under the
# package dir (no setuptools-style package_data needed). The only database
# content riding the wheel is the audited public-domain panel under
# src/gapit/data/dbs/ (gspec.bundled; 30 MiB budget, AGENTS.md §6); every
# provider still downloads from upstream at fetch time (license compliance —
# CARD/VFDB terms forbid redistribution).

[tool.ruff]
src = ["src"]
target-version = "py312"
line-length = 100
exclude = [".pixi", "dist", "build"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RET", "RUF"]

[tool.ruff.lint.per-file-ignores]
# mcp_schemas: keyword-style dict(...) is deliberate — it compacts the tool
# property maps; C408's literal rewrite would re-inflate the module.
"src/gapit/mcp_schemas.py" = ["C408"]

[tool.basedpyright]
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
# The conda recipe contains the sdist's own SHA256; including it would make the
# hash self-referential. The recipe lives in the repo, never in the sdist.
exclude = ["/recipe"]
