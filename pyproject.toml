[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gapit"
version = "0.1.0"
description = "Mass screening of contigs for antimicrobial resistance and virulence genes — agent-first Python reimplementation of abricate"
readme = "README.md"
authors = [{ name = "indexofire", email = "indexofire@gmail.com" }]
requires-python = ">=3.11"
license = "GPL-2.0-only"
keywords = ["bioinformatics", "AMR", "virulence", "blast", "genomics"]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "rich>=13",
]

[project.scripts]
gapit = "gapit.cli:app"
gapit-mcp = "gapit.mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gapit"]
# Hatchling's `packages` selection ships EVERY non-gitignored file under the
# package dir (no setuptools-style package_data needed): the bundled DB
# snapshots in src/gapit/data/snapshots/*.tar.gz ride the wheel as committed
# package files (Wave G). Verified: .gitignore carries no *.tar.gz pattern.
# A force-include mapping is deliberately NOT used — it fails the build while
# the source directory does not exist yet.

[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 100
exclude = [".pixi", "dist", "build"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RET", "RUF"]

[tool.basedpyright]
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
