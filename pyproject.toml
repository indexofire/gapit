[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gapit"
version = "0.5.0"
description = "Mass screening of contigs and reads for known genes — agent-first Python reimplementation of abricate"
readme = "README.md"
authors = [{ name = "indexofire", email = "indexofire@gmail.com" }]
requires-python = ">=3.11"
license = "MIT"
keywords = ["bioinformatics", "gene-screening", "blast", "genomics", "abricate", "AMR", "virulence"]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "rich>=13",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/indexofire/gapit"
Documentation = "https://indexofire.github.io/gapit/"
Changelog = "https://github.com/indexofire/gapit/blob/main/CHANGELOG.md"
Source = "https://github.com/indexofire/gapit"
Issues = "https://github.com/indexofire/gapit/issues"

[project.scripts]
gapit = "gapit.cli:app"
gapit-mcp = "gapit.mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gapit"]
# Hatchling's `packages` selection ships every non-gitignored file under the
# package dir (no setuptools-style package_data needed). The only database
# content riding the wheel is the audited public-domain panel under
# src/gapit/data/dbs/ (gapit.bundled); every provider still downloads from
# upstream at fetch time (license compliance — CARD/VFDB terms forbid
# redistribution).

[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 100
exclude = [".pixi", "dist", "build"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RET", "RUF"]

[tool.ruff.lint.per-file-ignores]
# mcp_schemas: keyword-style dict(...) is deliberate — it compacts the tool
# property maps; C408's literal rewrite would re-inflate the module.
"src/gapit/mcp_schemas.py" = ["C408"]

[tool.basedpyright]
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
