[workspace]
authors = ["indexofire <indexofire@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "gaita"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
lint = "ruff check"
fmt = "ruff format"
typecheck = "basedpyright"
test = "pytest"
gaita = "gaita"

[dependencies]
python = "3.14.*"
blast = ">=2.15"
any2fasta = ">=0.4"

[pypi-options]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[pypi-dependencies]
gaita = { path = ".", editable = true }
ruff = ">=0.6"
basedpyright = ">=1.19"
pytest = ">=8"
