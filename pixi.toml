[workspace]
authors = ["indexofire <indexofire@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "gapit"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
lint = "ruff check"
fmt = "ruff format"
typecheck = "basedpyright"
test = "pytest"
gapit = "gapit"

[dependencies]
blast = ">=2.15"
minimap2 = ">=2.24"

# CI matrix (AGENTS.md §2): each feature pins one python; the conda + pypi deps
# of the default feature apply to every environment that includes it.
[feature.py314.dependencies]
python = "3.14.*"

[feature.py311.dependencies]
python = "3.11.*"

[feature.py313.dependencies]
python = "3.13.*"

[pypi-options]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[pypi-dependencies]
gapit = { path = ".", editable = true }
ruff = ">=0.6"
basedpyright = ">=1.19"
pytest = ">=8"

# abricate's bioconda perl stack (zlib 1.2) cannot co-solve with the python>=3.13
# stack (libzlib>=1.3), so the parity env is abricate-only; the harness runs on
# the default env's python and merges both envs' PATHs.
[feature.parity.dependencies]
abricate = "*"

[feature.parity.tasks]
parity = ".pixi/envs/default/bin/python tests/parity/run_parity.py"
summary-parity = ".pixi/envs/default/bin/python tests/parity/run_summary_parity.py"

# Docs site (MkDocs Material). Dev-only: never in gapit's runtime deps or the
# gates environments (AGENTS.md §2 dependency discipline).
[feature.docs.pypi-dependencies]
mkdocs-material = ">=9.5"

[environments]
default = ["py314"]
parity = { features = ["parity"], no-default-feature = true }
py311 = ["py311"]
py313 = ["py313"]
# py314 needed alongside docs: python lives in the pyXX features, not the
# default feature, and the mkdocs pypi-dep requires a conda python to solve.
docs = { features = ["py314", "docs"] }
