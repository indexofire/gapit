[workspace]
authors = ["indexofire <indexofire@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "gapit"
platforms = ["linux-64"]
version = "0.6.2"

[tasks]
lint = "ruff check"
fmt = "ruff format"
fmt-check = "ruff format --check"
typecheck = "basedpyright"
test = "pytest"
gapit = "gapit"

[dependencies]
blast = ">=2.15"
minimap2 = ">=2.24"

# CI baseline (AGENTS.md §2): Python 3.12 only, matching gside/gmlst and gseek.
[feature.py312.dependencies]
python = "3.12.*"


[pypi-dependencies]
gapit = { path = ".", editable = true }
ruff = ">=0.6"
basedpyright = ">=1.19"
pytest = ">=8"

# abricate's bioconda perl stack (zlib 1.2) cannot co-solve with the python>=3.13
# stack (libzlib>=1.3), so the parity env is abricate-only; the harness runs on
# the default env's python and merges both envs' PATHs.
[feature.parity.dependencies]
abricate = "*"

[feature.parity.tasks]
parity = ".pixi/envs/default/bin/python tests/parity/run_parity.py"
summary-parity = ".pixi/envs/default/bin/python tests/parity/run_summary_parity.py"

# Docs site (MkDocs Material). Dev-only: never in gapit's runtime deps or the
# gates environments (AGENTS.md §2 dependency discipline).
[feature.docs.pypi-dependencies]
mkdocs-material = ">=9.5"
mkdocs-static-i18n = ">=1.2"

# Optional alignment engine for every supported Python (3.12).
[feature.gseek.pypi-dependencies]
gseek = ">=0.9.1"

[environments]
default = ["py312", "gseek"]
parity = { features = ["parity"], no-default-feature = true }
# Python lives in py312, not the default feature; docs needs a conda python.
docs = { features = ["py312", "docs"] }
