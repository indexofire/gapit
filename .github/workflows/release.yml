name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # OIDC token for PyPI trusted publishing (pypa/gh-action-pypi-publish).
  id-token: write

jobs:
  gates:
    name: release gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: false
      - run: pixi install --locked
      - run: pixi run lint
      - run: pixi run fmt-check
      - run: pixi run typecheck
      - run: pixi run test

  publish:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Install the built wheel and smoke-test it
        run: |
          python -m pip install dist/*.whl
          gapit --version
          gapit schema report > /dev/null
          gapit db path --json > /dev/null

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A re-run (or a re-tagged release) must not fail because the files
          # already exist: the upload is a no-op instead.
          skip-existing: true

  # A tag must also produce a GitHub Release: the PyPI publish above is only half
  # the story, and before this job the Releases page drifted (tags v0.6.0-v0.6.5
  # existed while "Latest" still pointed at v0.5.6). The notes are the tag's
  # CHANGELOG section, so the release page and the changelog can never disagree.
  github-release:
    name: github release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract the CHANGELOG section for this tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {inside=1; next}
            inside && /^## \[/ {exit}
            inside {print}
          ' CHANGELOG.md | sed '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "See CHANGELOG.md for the $version changes." > notes.md
          fi
          head -5 notes.md

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "gapit ${GITHUB_REF_NAME#v}" \
              --notes-file notes.md \
              --verify-tag
          fi
