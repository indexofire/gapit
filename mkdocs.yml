site_name: gapit
site_description: >-
  Mass screening of contigs and reads for known genes — an agent-first
  Python reimplementation of abricate.
site_url: https://indexofire.github.io/gapit/
repo_url: https://github.com/indexofire/gapit
repo_name: indexofire/gapit
strict: true

theme:
  name: material
  features:
    - navigation.top
    - navigation.sections
    - content.code.copy

# search must be declared explicitly (and before i18n) so mkdocs-material keeps
# it; i18n then localizes and deduplicates it per language. reconfigure_material
# (default true) lets i18n own the theme language switcher, contextualized per page.
plugins:
  - search
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          nav_translations:
            Home: 首页
            Installing gapit: 安装 gapit
            Quickstart: 快速开始
            Screening: 筛查
            Contigs: contig 筛查
            Reads (FASTQ): reads（FASTQ）筛查
            Summarizing reports: 汇总报告
            Databases: 数据库
            Custom databases: 自定义数据库
            Outputs: 输出
            MCP server: MCP 服务器
            gapit for agents: 面向 agent 的 gapit
            FAQ: 常见问题

markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installing gapit: installation.md
  - Quickstart: quickstart.md
  - Screening:
      - Contigs: screen.md
      - Reads (FASTQ): reads.md
  - Summarizing reports: summary.md
  - Databases: databases.md
  - Custom databases: custom-db.md
  - Outputs: outputs.md
  - MCP server: mcp.md
  - gapit for agents: agents.md
  - FAQ: faq.md
