site_name: gapit
site_description: >-
  Mass screening of contigs and reads for known genes — an agent-first
  Python reimplementation of abricate.
site_url: https://indexofire.github.io/gapit/
repo_url: https://github.com/indexofire/gapit
repo_name: indexofire/gapit
strict: true

theme:
  name: material
  # Desktop: top tabs carry the primary pages, page content sits on the left,
  # and the right-hand TOC remains. The primary sidebar is hidden by
  # stylesheets/extra.css; tablet/mobile keep the drawer navigation.
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.path
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    primary: orange

# search must be declared explicitly (and before i18n) so mkdocs-material keeps
# it; i18n then localizes and deduplicates it per language. reconfigure_material
# (default true) lets i18n own the theme language switcher, contextualized per page.
plugins:
  - search
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          nav_translations:
            Home: 首页
            Getting started: 快速上手
            Installing gapit: 安装 gapit
            Quickstart: 快速开始
            User guide: 使用指南
            Screening: 筛查
            Contigs: contig 筛查
            Reads (FASTQ): reads（FASTQ）筛查
            Summarizing reports: 汇总报告
            Outputs: 输出
            Custom databases: 自定义数据库
            Typing schemes: 分型方案
            Meningococcal serogroup typing (nme_sero): 脑膜炎奈瑟菌血清群分型（nme_sero）
            Databases: 数据库
            Database catalog: 数据库目录
            Data directory: 数据目录
            Interfaces: 接口
            gseek engine: gseek 引擎
            MCP server: MCP 服务器
            gapit for agents: 面向 agent 的 gapit
            FAQ: 常见问题

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - fenced_code
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started:
      - start/index.md
      - Installing gapit: installation.md
      - Quickstart: quickstart.md
  - User guide:
      - guide/index.md
      - Screening:
          - Contigs: screen.md
          - Reads (FASTQ): reads.md
      - Summarizing reports: summary.md
      - Outputs: outputs.md
      - Custom databases: custom-db.md
      - Typing schemes: typing.md
      - Meningococcal serogroup typing (nme_sero): nme_sero.md
  - Databases:
      - db/index.md
      - Database catalog: databases.md
      - Data directory: datadir.md
  - Interfaces:
      - interfaces/index.md
      - gseek engine: gseek-engine.md
      - MCP server: mcp.md
      - gapit for agents: agents.md
  - FAQ: faq.md
