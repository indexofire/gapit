site_name: gapit
site_description: >-
  Mass screening of contigs and reads for antimicrobial resistance and
  virulence genes — an agent-first Python reimplementation of abricate.
site_url: https://indexofire.github.io/gapit/
repo_url: https://github.com/indexofire/gapit
repo_name: indexofire/gapit
strict: true

theme:
  name: material
  features:
    - navigation.top
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installing gapit: installation.md
  - Quickstart: quickstart.md
  - Screening:
      - Contigs: screen.md
      - Reads (FASTQ): reads.md
  - Summarizing reports: summary.md
  - Databases: databases.md
  - Outputs: outputs.md
  - MCP server: mcp.md
  - gapit for agents: agents.md
  - FAQ: faq.md
